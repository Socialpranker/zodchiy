<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 272" width="860" height="272" role="img" aria-label="Admission rule: one axis is a hypothesis and stays out, two axes make a finding, three make a verdict">
  <rect width="860" height="272" fill="#0B0B0C"/>
  <g font-family="ui-serif, Georgia, 'Times New Roman', serif" fill="#F2EFE9">
    <text x="40" y="52" font-size="20" letter-spacing="0.01em">A finding is admitted by convergence</text>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12">
    <text x="40" y="80" fill="#6E6A63">intent &#183; structure &#183; behaviour &#8212; how many of them agree</text>

    <rect x="40" y="106" width="236" height="118" fill="#141416"/>
    <rect x="40" y="106" width="236" height="2" fill="#2A2A2C"/>
    <text x="58" y="142" fill="#6E6A63" font-size="26">1</text>
    <text x="58" y="170" fill="#F2EFE9" font-size="13">hypothesis</text>
    <text x="58" y="192" fill="#6E6A63">stays out of the report</text>

    <rect x="302" y="106" width="236" height="118" fill="#141416"/>
    <rect x="302" y="106" width="236" height="2" fill="#B4532A"/>
    <text x="320" y="142" fill="#B4532A" font-size="26">2</text>
    <text x="320" y="170" fill="#F2EFE9" font-size="13">finding</text>
    <text x="320" y="192" fill="#6E6A63">enters, missing axis named</text>

    <rect x="564" y="106" width="236" height="118" fill="#141416"/>
    <rect x="564" y="106" width="236" height="2" fill="#2A2A2C"/>
    <text x="582" y="142" fill="#F2EFE9" font-size="26">3</text>
    <text x="582" y="170" fill="#F2EFE9" font-size="13">verdict</text>
    <text x="582" y="192" fill="#6E6A63">enough to base an ADR on</text>

    <text x="40" y="252" fill="#6E6A63">cost comes from git history &#8212; a smell nobody pays for is not a finding</text>
  </g>
</svg>
